## IDF Component Manager manifest
dependencies:
  idf:
    version: ">=5.1.0"

  ## LVGL — graphics library
  lvgl/lvgl:
    version: ">=8.3.0,<9.0.0"
    rules:
      - if: "idf_version >=5.0"

  ## Espressif LCD panel helpers
  espressif/esp_lcd_touch:
    version: "^1.0.0"

  ## esp-lvgl-port: bridges esp_lcd → LVGL flush callbacks + input
  espressif/esp_lvgl_port:
    version: "^1.4.0"
